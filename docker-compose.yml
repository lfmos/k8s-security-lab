services:
  backend:
    build:
      context: ./backend
    container_name: cluster-sentinel-backend
    environment:
      APP_ENV: development
      APP_VERSION: 1.0.0
      API_KEY: local-demo-key
    restart: unless-stopped
    networks:
      - cluster-sentinel-network

  frontend:
    build:
      context: ./frontend
    container_name: cluster-sentinel-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - cluster-sentinel-network

networks:
  cluster-sentinel-network:
    driver: bridge
